name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Install locked toolchain
        run: npm ci --ignore-scripts

      - name: Dependency audit
        run: npm run audit:security

      # Claims are a production safety gate, not advisory output.
      - name: Claims guard
        run: npm run check:claims

      - name: Internal links and assets
        run: npm run check:links

      - name: HTML validity
        run: npm run check:html

      - name: Public truth contract
        run: npm run check:truth

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://bluegolddaily.com' }}
        run: npm run build

      - name: Built public truth contract
        run: npm run check:truth -- --dist

      - name: Verify built CSP
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          script_directive="$(grep -o "script-src[^;]*" dist/index.html | head -n 1)"
          test -n "$script_directive"
          printf '%s\n' "$script_directive" | grep -q "'self'"
          printf '%s\n' "$script_directive" | grep -q "'sha256-"
          if printf '%s\n' "$script_directive" | grep -q "'unsafe-inline'"; then
            echo "::error::Built script-src permits unsafe-inline"
            exit 1
          fi

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist/
          retention-days: 7
