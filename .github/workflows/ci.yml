name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked toolchain
        run: npm ci --ignore-scripts

      - name: Dependency audit
        run: npm run audit:security

      # The claims guard runs first and blocks everything downstream. A
      # prohibited health claim, a fabricated institutional validation, or an
      # unfilled template placeholder fails the build before anything is built.
      - name: Claims guard
        run: npm run check:claims

      - name: Internal links and assets
        run: npm run check:links

      - name: HTML validity
        run: npm run check:html

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://bluegolddaily.com' }}
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist/
          retention-days: 7

  a11y:
    name: Accessibility and performance
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked toolchain
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Serve
        run: npm run serve:dist &

      - name: Wait for server
        run: ./node_modules/.bin/wait-on http://127.0.0.1:4173 -t 30000

      - name: Lighthouse
        run: |
          ./node_modules/.bin/lhci autorun \
            --collect.url=http://127.0.0.1:4173/index.html \
            --collect.url=http://127.0.0.1:4173/product.html \
            --collect.url=http://127.0.0.1:4173/science.html \
            --collect.numberOfRuns=1 \
            --assert.assertions.categories:accessibility=error \
            --assert.assertions.categories:seo=warn \
            --assert.assertions.categories:performance=warn \
            --upload.target=filesystem \
            --upload.outputDir=./lighthouse
        continue-on-error: true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: lighthouse/
          retention-days: 7
