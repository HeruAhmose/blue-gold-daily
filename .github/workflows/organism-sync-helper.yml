name: Organism Sync Helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/organism-pages-production-sync-20260823
      - name: Apply canonical seven-organ vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('organism.html')
          s = p.read_text()
          replacements = {
              '<span class="k">Metabolism</span>': '<span class="k">Heart</span>',
              '<span class="k">Nerves</span>': '<span class="k">Brain</span>',
              '<span class="k">Blood</span>': '<span class="k">Vessels</span>',
              '<span class="k">Immunity</span>': '<span class="k">Lymphatic</span>',
              "r:'Metabolism'": "r:'Heart'",
              "r:'Nervous system'": "r:'Brain'",
              "r:'Circulatory system'": "r:'Vessels'",
              "r:'Immune system'": "r:'Lymphatic'",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected source token: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -Fq '<span class="k">Heart</span>' organism.html
          grep -Fq '<span class="k">Brain</span>' organism.html
          grep -Fq '<span class="k">Vessels</span>' organism.html
          grep -Fq '<span class="k">Lymphatic</span>' organism.html
          ! grep -Fq "r:'Metabolism'" organism.html
          ! grep -Fq "r:'Nervous system'" organism.html
          ! grep -Fq "r:'Circulatory system'" organism.html
          ! grep -Fq "r:'Immune system'" organism.html
      - name: Commit only organism vocabulary correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- organism.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add organism.html
          git commit -m 'fix(organism): align canonical seven-organ vocabulary'
          git push origin HEAD:fix/organism-pages-production-sync-20260823
