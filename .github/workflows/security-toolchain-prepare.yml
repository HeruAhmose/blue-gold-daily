name: security-toolchain-prepare

on:
  push:
    branches: [agent/security-hardening-20260816]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Frozen install
        run: npm ci --ignore-scripts

      - name: Full dependency audit
        run: npm audit --audit-level=low

      - name: Native checks
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify built CSP exists and forbids generic inline scripts
        shell: bash
        run: |
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          grep -q "script-src 'self' 'inline-speculation-rules' 'sha256-" dist/index.html
          if grep -q "script-src[^\"]*'unsafe-inline'" dist/index.html; then
            echo "::error::Built script CSP permits unsafe-inline"
            exit 1
          fi
