name: security-toolchain-prepare

on:
  push:
    branches: [agent/security-hardening-20260816]

permissions:
  contents: write

jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/security-hardening-20260816
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'

      - name: Synchronize lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Persist synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile metadata already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(security): synchronize audited lockfile metadata"
            git push origin HEAD:agent/security-hardening-20260816
          fi

      - name: Frozen install
        run: npm ci --ignore-scripts

      - name: Full dependency audit
        run: npm audit --audit-level=low

      - name: Native checks
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify built CSP
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          script_directive="$(grep -o "script-src[^;]*" dist/index.html | head -n 1)"
          test -n "$script_directive"
          printf '%s\n' "$script_directive" | grep -q "'self'"
          printf '%s\n' "$script_directive" | grep -q "'sha256-"
          if printf '%s\n' "$script_directive" | grep -q "'unsafe-inline'"; then
            echo "::error::Built script-src permits unsafe-inline"
            exit 1
          fi
