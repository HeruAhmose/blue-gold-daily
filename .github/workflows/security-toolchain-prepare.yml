name: security-toolchain-prepare

on:
  push:
    branches: [agent/security-hardening-20260816]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/security-hardening-20260816
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Lock CI and deployment tools
        run: |
          npm install --save-dev --save-exact \
            serve@14 \
            html-validate@8 \
            wait-on@7 \
            @lhci/cli@0.13 \
            netlify-cli@17 \
            vercel@latest

      - name: Persist exact package graph
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Toolchain graph already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(security): lock CI and deployment toolchain"
            git push origin HEAD:agent/security-hardening-20260816
          fi

      - name: Frozen install
        run: npm ci

      - name: Full dependency audit
        run: npm audit --audit-level=low

      - name: Native checks
        run: npm test

      - name: Production build
        run: npm run build
